<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basket Center — Gestão de Clube e Equipas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--paper:#fffdf9;--ink:#1b2230;--ink2:#4a5263;--mute:#8a90a0;--line:#e3ddd3;--line2:#efeae2;--or:#e2621b;--or2:#fbe7da;--of:#2f63c7;--of2:#e3ecfb;--df:#178a5c;--df2:#dff3ea;--gold:#b7860b;--gold2:#fbf0d2;--red:#c7392f;--r:12px;--shadow:0 1px 2px rgba(27,34,48,.06),0 6px 20px rgba(27,34,48,.05);
--s1:#d9534f;--s2:#ee8b3a;--s3:#e8bf2c;--s4:#8cbf3f;--s5:#2e9e5b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif}
h1,h2,h3,h4{font-family:"Barlow Condensed",Archivo,sans-serif;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.topin{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
.brand span{font-size:12px;color:#b9c0cf}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#c9cfdb}
.role{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.role.admin{background:var(--gold2);color:var(--gold)}.role.responsavel{background:var(--or2);color:var(--or)}.role.tecnico{background:var(--df2);color:var(--df)}.role.none{background:#3a4357;color:#c9cfdb}
.tabs{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#b9c0cf;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:var(--or)}
.wrap{max-width:1240px;margin:0 auto;padding:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#cfc6b8}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:#cc5512}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--red)}.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;outline:none}
.inp:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or2)}
.inp:disabled{background:var(--line2);color:var(--ink2)}
textarea.inp{resize:vertical;min-height:64px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin-bottom:4px;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}.kpi b{display:block;font-family:"Barlow Condensed";font-size:32px;line-height:1}.kpi span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .inp{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;background:var(--ink);display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed";font-size:48px;font-weight:700;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .num{position:absolute;top:8px;left:8px;background:var(--or);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:18px;border-radius:7px;padding:0 8px}
.card .sc{position:absolute;top:8px;right:8px}
.card .bd{padding:10px 12px}.card .bd b{font-size:15px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 7px;border-radius:999px;font-weight:700;font-size:12.5px;color:#fff;font-variant-numeric:tabular-nums}
.chip.na{background:#e6e1d8;color:var(--mute)}
.tg{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--line2);color:var(--ink2)}
.tg.of{background:var(--of2);color:var(--of)}.tg.def{background:var(--df2);color:var(--df)}.tg.av{background:var(--or2);color:var(--or)}
.phead{display:flex;gap:14px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.mini{width:56px;height:56px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed";font-size:24px;font-weight:700;overflow:hidden;flex:none}
.mini img{width:100%;height:100%;object-fit:cover}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.ptab{background:none;border:0;padding:11px 13px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--ink);border-color:var(--or)}
.tbody{padding:18px}
.saved{font-size:12.5px;color:var(--mute);margin-left:auto}.saved.w{color:#b86a1d}
.detail{display:grid;grid-template-columns:300px 1fr;gap:18px}
.photo{width:100%;aspect-ratio:1;border-radius:12px;background:var(--ink);display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed";font-size:64px;font-weight:700;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.colh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.colh h3{font-size:20px;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:3px}
.obj{border:1px solid var(--line);border-left:4px solid var(--of);border-radius:10px;background:#fff;margin-bottom:10px}
.obj.def{border-left-color:var(--df)}
.objh{display:flex;align-items:center;gap:8px;padding:8px 10px}
.onum{font-family:"Barlow Condensed";font-weight:700;font-size:20px;width:22px;text-align:center;color:var(--of)}.obj.def .onum{color:var(--df)}
.objh input{flex:1;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;font-weight:600;min-width:0}
.objh input:hover{border-color:var(--line)}.objh input:focus{border-color:var(--or);background:#fff;outline:none}
.vc{font-size:12px;color:var(--ink2);white-space:nowrap}
.plus{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:18px;line-height:1;font-weight:600;flex:none}
.plus.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.objb{padding:4px 12px 12px 40px;display:flex;flex-direction:column;gap:10px}
.exl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
.exl li{display:flex;gap:8px;align-items:flex-start;background:var(--line2);border-radius:8px;padding:6px 8px;font-size:13.5px}.exl li span{flex:1}
.x{border:0;background:none;color:var(--mute);font-size:16px;line-height:1;padding:0 2px}.x:hover{color:var(--red)}
.vlinks{display:flex;flex-direction:column;gap:4px}
.vlink{display:flex;gap:8px;align-items:center;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer}
.vlink:hover{border-color:var(--or)}
.vlink i{font-style:normal;color:#e62117}
.aicard{border:1px dashed #d9c6b5;background:#fffaf5;border-radius:10px;padding:10px 12px}.aicard h4{font-size:17px}
.aigrid{display:grid;gap:10px}
.sug{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;display:flex;gap:10px;align-items:flex-start}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.legend div{font-size:12px;border-radius:8px;padding:6px 8px;background:var(--line2)}
.legend b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;margin-right:5px;font-size:12px}
.aform{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin-bottom:16px}
.aform.v{border:1px dashed #d9c6b5;background:#fffaf5}
.agrid{width:100%;border-collapse:collapse}
.agrid th,.etable th,.utable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:left;font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.agrid td{padding:7px 6px;border-top:1px solid var(--line2);vertical-align:middle}
.agrid td.t{font-weight:600;font-size:13.5px;min-width:180px}
.agrid tr.sec td{background:var(--bg);font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;min-width:27px;height:27px;padding:0 8px;font-weight:600;font-size:13px;border-right:1px solid var(--line2);color:var(--ink2)}
.seg button:last-child{border-right:0}.seg button.on{color:#fff;background:var(--ink)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;flex-wrap:wrap}
.hrow .d{font-weight:600;min-width:94px}
.ctx{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--line2);color:var(--ink2);font-weight:600}
.etable,.utable{width:100%;border-collapse:collapse;margin-top:10px}
.etable td,.utable td{padding:8px 6px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
.up{color:var(--df);font-weight:700}.down{color:var(--red);font-weight:700}.flat{color:var(--mute);font-weight:700}
.chart{width:100%;height:auto;display:block}
.clegend{display:flex;gap:16px;font-size:13px;margin-top:4px;flex-wrap:wrap}.clegend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.report{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.55;min-height:60px}
.strip{display:inline-flex;gap:2px}.strip i{width:9px;height:14px;border-radius:2px;background:#ebe5db}
details.proto{margin-top:3px;font-size:12.5px}details.proto summary{cursor:pointer;color:var(--mute)}details.proto ul{margin:4px 0;padding-left:18px}
.trow{display:grid;grid-template-columns:minmax(200px,1.3fr) auto minmax(160px,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.trow .tn .muted{font-size:12px}.tin{width:92px}.tfb{font-size:13px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.vcard.hl{box-shadow:0 0 0 3px var(--or)}
.vcard video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.yt{aspect-ratio:16/9;background:linear-gradient(135deg,#1b2230,#3a4357);display:grid;place-items:center;color:#fff;text-decoration:none;position:relative}
.yt .play{width:58px;height:40px;background:#e62117;border-radius:10px;display:grid;place-items:center}
.yt .play:after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.yt small{position:absolute;bottom:8px;left:10px;font-size:11.5px;color:#c9cfdb}
.vb{padding:9px 11px}.vb b{display:block;font-size:14px}
.hits{border:1px solid var(--line);border-radius:9px;background:#fff;margin-top:6px;max-height:240px;overflow:auto}
.hit{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2)}.hit:last-child{border-bottom:0}
.roles3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.r3{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff}.r3 h4{font-size:18px;margin-bottom:4px}.r3 ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff;cursor:pointer}
.tchip.on{background:var(--df2);border-color:#a9dcc5;color:var(--df);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.note{font-size:13px;background:var(--line2);border-radius:8px;padding:9px 11px;color:var(--ink2)}
.err{color:var(--red);font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:50}
.hide{display:none}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 56px)}
.side{background:#141a26;color:#c9cfdb;padding:16px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side .sl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f7890;margin:14px 10px 6px}
.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#c9cfdb;padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.side button span{color:var(--or);font-family:"Barlow Condensed";font-size:14px;width:18px}
.side button:hover{background:#1f2738}.side button.on{background:#262f43;color:#fff}
.main{min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--or)}.mcard .mn{font-family:"Barlow Condensed";font-size:26px;font-weight:700;color:var(--or);line-height:1}.mcard b{font-size:15px}
.alist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.arow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;flex-wrap:wrap}.arow:hover{border-color:var(--or)}
.adot{display:inline-block;width:10px;height:10px;border-radius:3px}.ad{font-weight:600;min-width:86px;font-size:13px}
.alerts{list-style:none;padding:0;margin:8px 0 0}.alerts li{padding:8px 10px;border-left:3px solid #e8bf2c;background:#fffaf0;border-radius:6px;margin-bottom:6px;font-size:13.5px;cursor:pointer}.alerts li.bad{border-color:var(--red);background:#fdf1f0}
.vchip{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--df2);color:var(--df);white-space:nowrap}.vchip.warn{background:#fff1d6;color:#9a6a00}.vchip.bad{background:#fde3e1;color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cday{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-height:170px;padding:6px;display:flex;flex-direction:column;gap:5px}.cday.now{border-color:var(--or);box-shadow:0 0 0 2px var(--or2)}
.cdh{font-size:12px;color:var(--mute);text-transform:uppercase;font-weight:700}.cdh b{color:var(--ink);font-size:15px}
.cev{border-left:4px solid;background:#fff;border-radius:6px;padding:5px 7px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.05)}.cev b{font-size:12.5px}.cev span{color:var(--ink2)}.cev.cf{background:#fdf1f0}.cfw{color:var(--red)!important;font-weight:700}
.cadd{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:6px;color:var(--mute);font-size:16px}
.season{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}.season div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.season b{display:block;font-family:"Barlow Condensed";font-size:26px;line-height:1}.season span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.leg{display:flex;flex-direction:column;gap:4px;font-size:13px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.mbars{display:flex;gap:12px;align-items:flex-end;height:170px;margin-top:10px}.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.mbb{flex:1;display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center}.mbb i{width:40%;max-width:22px;border-radius:3px 3px 0 0}.mb span{font-size:11px;color:var(--mute)}
.hb{display:flex;flex-direction:column;gap:6px;margin-top:8px}.hbr{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;font-size:13px}.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{background:var(--line2);height:12px;border-radius:3px;overflow:hidden}.hbt i{display:block;height:100%}.hbr b{text-align:right}
.qc{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700}.qc.ok{background:var(--df2);color:var(--df);border-color:#a9dcc5}.qc.due{background:#fde3e1;color:var(--red);border-color:#f1b9b3}
.fgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fgrid3 .full{grid-column:1/-1}
.eform{border:1px solid var(--or);box-shadow:0 0 0 3px var(--or2)}
.tcard .muted{font-size:12.5px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow-x:auto;padding:6px}.side .sl{display:none}.side button{white-space:nowrap;width:auto}.cal{grid-template-columns:1fr}.cday{min-height:0}.fgrid3{grid-template-columns:1fr 1fr}}
.f360{max-width:1080px}
.f360k{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.f360k .rule{width:34px;height:12px;background:repeating-linear-gradient(90deg,var(--red) 0 3px,transparent 3px 6px)}
.f360n{font-family:"Barlow Condensed";font-size:54px;font-weight:700;text-transform:uppercase;line-height:1;margin:8px 0 18px;letter-spacing:.01em}
.f360top{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:16px}
.f360ph{width:150px;height:170px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed";font-size:56px;font-weight:700;overflow:hidden}
.f360ph img{width:100%;height:100%;object-fit:cover}
.f360kp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;border-top:1px solid var(--line);padding-top:10px}
.f360kp span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.f360kp b{display:block;font-family:"Barlow Condensed";font-size:34px;font-weight:600;line-height:1.1}
.f360kp em{font-style:normal;font-size:11.5px;color:var(--mute)}
.f360g{display:grid;grid-template-columns:1fr 1.25fr;gap:26px;padding:18px 0;border-bottom:1px solid var(--line)}
.f360h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}.f360h.red{color:var(--red)}
.f360b{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-top:16px}

function bandChip(t,b){if(!b)return '<span class="chip na">–</span>';if(b.ix==null)return '<span class="chip na" title="'+esc(b.why)+'">sem referência</span>';return '<span class="chip" style="background:'+bandColor(t,b.ix)+'">'+b.label+'</span>'}

function signals(p){var need=[],str=[];TT.forEach(function(t){if(t.cresc)return;var s=series(p,t),l=s[s.length-1];if(!l||!l.b||l.b.ix==null)return;if(l.b.ix<=2)need.push([t,l]);else if(l.b.ix>=7)str.push([t,l])});return {need:need,str:str}}
function testLines(p){var out=[];TT.forEach(function(t){var s=series(p,t);if(!s.length)return;var l=s[s.length-1],pv=s.length>1?s[s.length-2]:null;

var loadErr={};
function errTxt(e){return (e&&(e.code||e.name)?(e.code||e.name)+": ":"")+(e&&e.message?e.message:String(e||"erro"))}
function snap(col){
  try{return db.collection(col).onSnapshot(function(q){try{var o={},docs=(q&&q.docs)||[];docs.forEach(function(d){try{o[d.id]=typeof d.data==="function"?d.data():d.data}catch(x){}});D[col]=o;delete loadErr[col]}catch(x){loadErr[col]=errTxt(x)}got[col]=true;onData(col)},function(e){loadErr[col]=errTxt(e);got[col]=true;onData(col)})}
  catch(e){loadErr[col]=errTxt(e);got[col]=true;setTimeout(function(){onData(col)},0)}
}
var loadT=null;
function onData(col){
  if(got.players&&got.videos&&got.roles){clearTimeout(loadT);ready=true}computeRole();if(role!=="admin"&&ui.tab==="usr")ui.tab="jog";
  if(W&&col==="players"){var fresh=D.players[W.id];if(!fresh){if(!wDirty&&!wSaving){W=null;ui.pid=null;toast("Este jogador foi removido")}}else if(!wDirty&&!wSaving){var keep=W.id;W=normP(clone(fresh));W.id=keep;if(!myPlayer(W)){W=null;ui.pid=null}}}
  var a=document.activeElement;if(a&&a.matches&&a.matches("input:not([type=file]):not([type=checkbox]):not([type=radio]),textarea,select")&&a!==document.body)return;
  render();
}
/* ---------- modo local: funciona em qualquer navegador (dados guardados neste navegador) ---------- */
var LOCAL=false,LSK="basketcenter-v1",LDB={};
var COLS=["players","videos","roles","equipas","staff","atividades","admin","docs","fin","config"];
function lsLoad(){try{var d=JSON.parse(localStorage.getItem(LSK)||"{}");COLS.forEach(function(c){LDB[c]=d[c]&&typeof d[c]==="object"?d[c]:{}})}catch(e){COLS.forEach(function(c){LDB[c]={}})}}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(LDB));return true}catch(e){toast("O armazenamento do navegador está cheio. Exporte uma cópia e reduza fotografias.");return false}}
function makeLocal(){
  lsLoad();var subs={};
  function fire(c){var docs=Object.keys(LDB[c]).map(function(id){return {id:id,data:function(){return clone(LDB[c][id])}}});(subs[c]||[]).forEach(function(cb){cb({docs:docs})})}
  function docRef(c,id){return {set:function(v){LDB[c][id]=clone(v);if(!lsSave())return Promise.reject({code:"quota_exceeded"});setTimeout(function(){fire(c)},0);return Promise.resolve()},delete:function(){delete LDB[c][id];lsSave();setTimeout(function(){fire(c)},0);return Promise.resolve()},
    onSnapshot:function(cb){setTimeout(function(){var v=LDB[c][id];cb({exists:!!v,data:function(){return v?clone(v):undefined}})},0);(subs["doc:"+c+"/"+id]=subs["doc:"+c+"/"+id]||[]).push(cb);return function(){}}}}
  db={collection:function(c){if(!LDB[c])LDB[c]={};return {onSnapshot:function(cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(function(){fire(c)},0);return function(){}},doc:function(id){return docRef(c,id)}}},
      doc:function(path){var p=path.split("/"),r=docRef(p[0],p[1]),set0=r.set;r.set=function(v){return set0(v).then(function(){var cb=subs["doc:"+path]||[];cb.forEach(function(f){f({exists:true,data:function(){return clone(v)}})})})};return r}};
  user={isOwner:function(){return true},canEdit:function(){return true},id:function(){return Promise.resolve("local")},me:function(){return Promise.resolve({name:""})},profiles:function(){return Promise.resolve({})},search:function(){return Promise.resolve([])}};
  LOCAL=true;
}
function exportData(){
  var data={app:"basketcenter",versao:1,exportado:new Date().toISOString(),dados:{}};COLS.forEach(function(c){data.dados[c]=D[c]===undefined?{}:(c==="config"?{main:D.config}:clone(D[c]))});
  var txt=JSON.stringify(data),name="basketcenter-copia-"+today()+".json";
  if(!LOCAL){copy(txt,"Cópia copiada: cole-a num ficheiro .json para guardar");return}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast("Cópia exportada: "+name)}catch(e){copy(txt,"Cópia copiada para a área de transferência")}
}
function importData(file){var rd=new FileReader();rd.onload=async function(){try{var d=JSON.parse(rd.result),src=d&&d.dados;if(!src||!src.players)throw 0;ui.impAll=src;render()}catch(e){toast("Ficheiro inválido: use uma cópia exportada desta plataforma")}};rd.readAsText(file)}
async function doImportAll(){var src=ui.impAll,n=0;ui.impAll=null;
  for(var i=0;i<COLS.length;i++){var c=COLS[i];if(c==="roles"&&!LOCAL)continue;var o=src[c]||{};for(var id in o){try{if(c==="config"){if(isAdmin()){await db.doc("config/main").set(o[id]);D.config=o[id]}}else{await db.collection(c).doc(id).set(o[id]);n++}}catch(e){}}}
  toast(n+" registos importados");render()}
function localBar(){return LOCAL?'<div class="note" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px"><b>Modo navegador.</b> Os dados ficam guardados só neste navegador e neste computador. Exporte cópias com regularidade e importe-as noutro computador.</span><button class="btn sm" data-act="exportall">Exportar cópia</button><label class="btn sm">Importar cópia<input type="file" accept=".json,application/json" class="hide" data-file="impall"></label></div>':''}
function impAllPanel(){var src=ui.impAll,cnt=function(c){return Object.keys(src[c]||{}).length};return '<div class="aform eform"><h3 style="font-size:22px">Importar cópia de segurança</h3><p>O ficheiro tem '+cnt("players")+' jogadores, '+cnt("equipas")+' equipas, '+cnt("atividades")+' atividades, '+cnt("videos")+' vídeos e '+cnt("fin")+' movimentos. Os registos com o mesmo identificador são substituídos; os restantes mantêm-se.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="impallno">Cancelar</button><button class="btn pri" data-act="impallyes">Importar</button></div></div>'}

async function start(){
  for(var i=0;i<30&&!(window.claude&&typeof window.claude.use==="function");i++)await new Promise(function(r){setTimeout(r,100)});
  var useErr="";
  if(window.claude&&typeof window.claude.use==="function"){try{db=await window.claude.use("db")}catch(e){useErr="db: "+errTxt(e)}try{user=await window.claude.use("user")}catch(e){useErr+=" user: "+errTxt(e)}}
  if(!db||!user){db=null;user=null;makeLocal()}
  try{me=await user.id()}catch(e){loadErr.user=errTxt(e)}
  try{ownerFlag=!!(await Promise.resolve(user.isOwner()))||!!(await Promise.resolve(user.canEdit()))}catch(e){}
  try{var m=await user.me();if(m&&m.name)ui.names[me]=m.name}catch(e){}
  if(!LOCAL){window.claude.use("assets").then(function(a){assets=a;render()},function(){});
  window.claude.use("sample").then(function(s){sampleCap=s;render()},function(){});}
  loadT=setTimeout(function(){if(!ready){["players","videos","roles"].forEach(function(c){if(!got[c]){got[c]=true;loadErr[c]=loadErr[c]||"sem resposta ao fim de 8 segundos"}});ready=true;computeRole();render()}},8000);
  snap("players");snap("videos");snap("roles");["equipas","staff","atividades","admin","docs","fin"].forEach(snap);
  try{db.doc("config/main").onSnapshot(function(d){try{D.config=(d&&d.exists!==false&&typeof d.data==="function"&&d.data())||{}}catch(x){D.config={}}render()},function(e){loadErr.config=errTxt(e);render()})}catch(e){loadErr.config=errTxt(e)}
  computeRole();render();
}
render();start();
})();
